name: Deploy Breakout to GitHub Pages

on:
  push:
    branches: [claude/breakout-game]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web version
        run: |
          rm -rf breakout_web/build/
          python -m pygbag --build breakout_web/

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la breakout_web/build/web/
          test -f breakout_web/build/web/index.html || (echo "ERROR: index.html not found!" && exit 1)

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: breakout_web/build/web/
