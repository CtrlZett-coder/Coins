<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --font:'Inter',sans-serif; --ios-bg:#fff; --ios-gray:#f2f2f7;
  --ios-blue:#007AFF; --ios-sec:#8e8e93; --ios-border:#e5e5ea;
  --ios-text:#000; --hbg:#fff; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
}
[data-theme="dark"] {
  --ios-bg:#000; --ios-gray:#1c1c1e; --ios-blue:#0A84FF;
  --ios-border:#38383a; --ios-text:#fff; --hbg:#1c1c1e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;height:var(--tg-viewport-stable-height,var(--tg-viewport-height,100vh));
  background:var(--ios-bg);font-family:var(--font);
  color:var(--ios-text);display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s}

/* TOP TABS */
#top-tabs{display:flex;background:var(--hbg);border-bottom:.5px solid var(--ios-border);padding:0 4px;flex-shrink:0}
.top-tab{flex:1;padding:11px 0;text-align:center;font-size:11px;font-weight:600;color:var(--ios-sec);
  border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
.top-tab.active{color:var(--ios-blue);border-bottom-color:var(--ios-blue)}

/* CHART */
#screen-chart{display:flex;flex-direction:column;flex:1;overflow:hidden}
#dual-header{display:flex;align-items:center;padding:10px 14px;border-bottom:.5px solid var(--ios-border);
  gap:8px;background:var(--hbg);flex-shrink:0}
.selector-box{flex:1;display:flex;align-items:center;background:var(--ios-gray);
  padding:8px 10px;border-radius:12px;cursor:pointer}
.selector-box:active{opacity:.7}
.sel-flag{font-size:18px;margin-right:7px;width:22px;text-align:center}
.sel-label{flex-grow:1;overflow:hidden}
.sel-code{font-weight:800;font-size:14px;display:block}
.sel-desc{font-size:9px;color:var(--ios-sec);text-transform:uppercase}
.sel-chevron{font-size:10px;color:var(--ios-sec);margin-left:4px}
.divider-icon{font-size:15px;color:var(--ios-sec)}

#price-ticker{padding:8px 16px 6px;background:var(--hbg);border-bottom:.5px solid var(--ios-border);flex-shrink:0}
#price-main{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
#price-row{display:flex;align-items:center;gap:8px;margin-top:2px}
#price-change{font-size:12px;font-weight:600}
#price-change.up{color:var(--green)}
#price-change.down{color:var(--red)}
#price-updated{font-size:11px;color:var(--ios-sec)}

#chart-wrapper{flex:1;position:relative;overflow:hidden}
#tv-chart{position:absolute;top:0;left:0;right:0;bottom:0}
#hitbox-fix{position:absolute;top:0;right:0;width:120px;height:40px;z-index:10}

#footer-controls{padding:10px 12px 20px;border-top:.5px solid var(--ios-border);background:var(--hbg);flex-shrink:0}
#periods{display:flex;background:var(--ios-gray);padding:2px;border-radius:10px;gap:2px}
.period-btn{flex:1;border:none;background:none;padding:9px 0;font-size:11px;font-weight:700;
  border-radius:8px;color:var(--ios-sec);cursor:pointer}
.period-btn.active{background:var(--ios-text);color:var(--ios-bg)}

/* CONVERTER */
#screen-conv{display:none;flex-direction:column;flex:1;overflow-y:auto;padding:14px;gap:10px}
.cc{background:var(--ios-gray);border-radius:16px;padding:14px}
.cl{font-size:11px;color:var(--ios-sec);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.cir{display:flex;align-items:center;gap:10px}
.ccb{display:flex;align-items:center;gap:6px;background:var(--ios-bg);border-radius:12px;
  padding:8px 10px;cursor:pointer;border:none;color:var(--ios-text);flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ccb .cf{font-size:19px}.ccb .ck{font-size:13px;font-weight:700}.ccb .cv{font-size:10px;color:var(--ios-sec)}
.ci{flex:1;background:none;border:none;outline:none;font-size:26px;font-weight:700;
  color:var(--ios-text);font-family:var(--font);text-align:right;min-width:0}
.ci::placeholder{color:var(--ios-sec)}
.csb{display:flex;align-items:center;justify-content:center;margin:-5px auto;
  width:36px;height:36px;border-radius:18px;background:var(--ios-blue);color:#fff;
  font-size:16px;border:none;cursor:pointer;z-index:1;position:relative;
  box-shadow:0 2px 8px rgba(0,122,255,.4)}
.rv{font-size:26px;font-weight:800;color:var(--ios-blue);text-align:right;flex:1}
.rt{font-size:12px;color:var(--ios-sec)}
.qrow{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{flex:1;min-width:50px;padding:9px 4px;background:var(--ios-gray);border:none;
  border-radius:10px;font-size:12px;font-weight:600;color:var(--ios-blue);cursor:pointer}

/* CALCULATOR SCREEN */
#screen-calc{display:none;flex-direction:column;flex:1;overflow:hidden;background:var(--ios-bg)}
#cdw{background:var(--hbg);flex-shrink:0;padding:10px 20px 8px;border-bottom:.5px solid var(--ios-border)}
#chist{font-size:13px;color:var(--ios-sec);text-align:right;min-height:18px;font-weight:400}
#cdisp{font-size:52px;font-weight:300;text-align:right;letter-spacing:-2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
#csubtabs{display:flex;background:var(--ios-gray);margin:10px 12px 6px;border-radius:10px;padding:2px;flex-shrink:0}
.cst{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;color:var(--ios-sec);
  border-radius:8px;cursor:pointer}
.cst.active{background:var(--ios-bg);color:var(--ios-text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* NUMPAD */
#numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:4px 12px 16px;flex-shrink:0}
.nb{border:none;border-radius:14px;font-size:22px;font-weight:400;cursor:pointer;
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  transition:opacity .1s;font-family:var(--font);color:var(--ios-text)}
.nb:active{opacity:.5}
.nf{background:#a5a5a5;color:#000}
[data-theme="dark"] .nf{background:#636366;color:#fff}
.no{background:var(--orange);color:#fff}
.no.aop{background:#fff;color:var(--orange)}
.nd{background:#e0e0e2;color:#000}
[data-theme="dark"] .nd{background:#2c2c2e}
.nz{grid-column:span 2;border-radius:14px;aspect-ratio:auto;padding:0 0 0 26px;
  justify-content:flex-start;height:64px}
.neq{background:var(--orange);color:#fff}

/* PERCENT CALC */
#pctcalc{display:none;flex-direction:column;gap:10px;padding:4px 12px 16px;overflow-y:auto;flex:1}
.prow{display:flex;gap:8px}
.piw{flex:1;background:var(--ios-gray);border-radius:12px;padding:10px 12px}
.pil{font-size:11px;color:var(--ios-sec);font-weight:600;margin-bottom:4px}
.pi{width:100%;background:none;border:none;outline:none;font-size:22px;font-weight:700;
  color:var(--ios-text);font-family:var(--font)}
.pi::placeholder{color:var(--ios-sec)}
.pres{display:flex;flex-direction:column;gap:7px}
.pr{background:var(--ios-gray);border-radius:12px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center}
.prl{font-size:13px;color:var(--ios-sec)}
.prv{font-size:18px;font-weight:700;color:var(--ios-blue)}
.prv.g{color:var(--green)}.prv.r{color:var(--red)}
.psect{text-align:center;font-size:11px;color:var(--ios-sec);font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;margin-top:4px}

/* MODAL */
#modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--ios-bg);
  z-index:9999;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;pointer-events:none}
#modal-overlay.open{transform:translateY(0);pointer-events:auto}
#mhdr{padding:14px 16px;border-bottom:.5px solid var(--ios-border);display:flex;
  justify-content:space-between;align-items:center;flex-shrink:0}
#mtitle{font-weight:800;font-size:17px}
#msearch{padding:10px 16px;flex-shrink:0}
#sinput{width:100%;padding:10px 12px;border-radius:10px;border:none;
  background:var(--ios-gray);font-size:15px;outline:none;color:var(--ios-text)}
#mtabs{display:flex;padding:0 16px 10px;gap:8px;overflow-x:auto;flex-shrink:0}
.mtab{padding:7px 14px;background:var(--ios-gray);border-radius:20px;font-size:12px;
  font-weight:700;color:var(--ios-sec);cursor:pointer;white-space:nowrap;border:none}
.mtab.active{background:var(--ios-blue);color:#fff}
#alist{overflow-y:auto;flex-grow:1}
.ai{display:flex;align-items:center;padding:11px 16px;border-bottom:.5px solid var(--ios-gray);cursor:pointer}
.ai.dis{opacity:.25;pointer-events:none}
.af{font-size:22px;margin-right:12px;width:28px;text-align:center}
.an{display:flex;flex-direction:column}
.ab{font-weight:700;font-size:15px}
.as{font-size:11px;color:var(--ios-sec)}

#theme-btn{position:fixed;bottom:72px;right:16px;z-index:100;background:var(--ios-blue);
  color:#fff;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);border:none;font-size:18px;cursor:pointer}
</style>
</head>

      <div class="pr"><span class="prl">Абсолютно (B − A)</span><span class="prv" id="pr5">–</span></div>
    </div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();

function applyViewport(){
  const h = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
  if(h > 50) document.body.style.height = h + 'px';
}

tg.onEvent('viewportChanged', ()=>{
  applyViewport();
  requestAnimationFrame(()=>{
    if(lwChart) lwChart.timeScale().fitContent();
    else createWidget();
  });
});

// ─── FOREX / RATES ────────────────────────────────────────
let fxRates={}, cryptoPrices={}, ratesFetched=0;

async function fetchRates(){
  if(Date.now()-ratesFetched<60000 && Object.keys(fxRates).length) return;
  try{
    const [fxRes,cgRes]=await Promise.all([
      fetch('https://open.er-api.com/v6/latest/USD'),
      fetch('https://api.coingecko.com/api/v3/simple/price?ids='+
        Object.values(CIDS).join(',')+'&vs_currencies=usd')
    ]);
    const fxD=await fxRes.json(), cgD=await cgRes.json();
    fxRates=fxD.rates||{};
    cryptoPrices={};
    for(const [tick,cid] of Object.entries(CIDS)){
      if(cgD[cid]) cryptoPrices[tick]=cgD[cid].usd;
    }
    ratesFetched=Date.now();
    convCalc();
    renderQuick();
  } catch(e){ document.getElementById('conv-rate').textContent='Ошибка загрузки'; }
}

function toUSD(id){
  if(id==='USD') return 1;
  if(cryptoPrices[id]!=null) return cryptoPrices[id];
  const r=fxRates[id]; return r?1/r:null;
}
function getRate(from,to){
  if(from===to) return 1;
  const f=toUSD(from), t=toUSD(to);
  return (f!=null&&t!=null)?f/t:null;
}
function fmtAmt(n,decimals){
  if(n==null||isNaN(n)) return '–';
  const d = decimals!=null ? decimals : (n>=1000?0:n>=1?2:6);
  return n.toLocaleString('ru-RU',{maximumFractionDigits:d});
}

// ─── CONVERTER ────────────────────────────────────────────
let convFrom=find('BTC'), convTo=find('USD'), convModalTarget='from';

function convCalc(){
  const amt=parseFloat(document.getElementById('conv-input').value);
  const rate=getRate(convFrom.id,convTo.id);
  if(rate==null){ document.getElementById('conv-result').textContent='–';
    document.getElementById('conv-rate').textContent='Курс недоступен'; return; }
  document.getElementById('conv-result').textContent = isNaN(amt)?'–':fmtAmt(amt*rate);
  const r=rate>=1?fmtAmt(rate):fmtAmt(rate,6);
  document.getElementById('conv-rate').textContent=`1 ${convFrom.id} = ${r} ${convTo.id}`;
}
function convSwap(){
  [convFrom,convTo]=[convTo,convFrom];
  document.getElementById('cf-flag').textContent=convFrom.f;
  document.getElementById('cf-code').textContent=convFrom.id;
  document.getElementById('ct-flag').textContent=convTo.f;
  document.getElementById('ct-code').textContent=convTo.id;
  convCalc(); renderQuick();
}
function renderQuick(){
  const row=document.getElementById('quick-row'); row.innerHTML='';
  const amts=quickAmounts(convFrom.id);
  amts.forEach(a=>{
    const b=document.createElement('button');
    b.className='qbtn'; b.textContent=fmtAmt(a,0)+' '+convFrom.id;
    b.onclick=()=>{ document.getElementById('conv-input').value=a; convCalc(); };
    row.appendChild(b);
  });
}
function quickAmounts(id){
  if(['IDR','VND','KRW','UZS','IRR','SLL','GNF','MMK','PYG','BIF'].includes(id)) return[100000,1000000,10000000];
  if(['RUB','KZT','AMD','COP','NGN','KES','DZD','ETB','HUF','ISK','SYP','TZS','AOA','HTG','MNT','PKR','YER','ZMW','CDF','MGA','IQD','KHR','RWF','UGX','LBP','MWK'].includes(id)) return[1000,10000,100000];
  if(['XAU','XPD','XPT'].includes(id)) return[0.1,1,10];
  if(id==='XAG') return[1,10,100];
  if(cryptoPrices[id]&&cryptoPrices[id]>1000) return[0.001,0.01,0.1];
  if(cryptoPrices[id]&&cryptoPrices[id]>10) return[0.1,1,10];
  if(cryptoPrices[id]) return[10,100,1000];
  return[100,1000,10000];
}

  '1D': ['5m', 288], '1M': ['1h', 720], '3M':  ['4h', 540],
  '6M': ['1d', 182], '12M':['1d', 365], 'ALL': ['1w', 260]

async function ensureFX(){
  if(Date.now()-fxCacheTime<300000&&Object.keys(fxCache).length) return;
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD');
    const d=await r.json(); fxCache=d.rates||{}; fxCacheTime=Date.now();
  }catch(e){}
}

async function fetchAndShowPrice(){
  const b=base.id, q=quote.id;
  try{
    let price=null, change=null;
    if(b==='IMOEX'){
      const r=await fetch('https://iss.moex.com/iss/engines/stock/markets/index/securities/IMOEX.json?iss.meta=off');
      const d=await r.json(), row=d.marketdata.data[0];
      price=row[2]??row[12]; const prev=row[3];
      change=prev?((price-prev)/prev*100):0;
    } else if(CIDS[b]){
      const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${CIDS[b]}&vs_currencies=usd&include_24hr_change=true`);
      const d=await r.json(), cid=CIDS[b];
      const usd=d[cid]?.usd; change=d[cid]?.usd_24h_change;
      if(usd!=null){
        if(q==='USD'){ price=usd; }
        else { await ensureFX(); price=q==='USD'?usd:usd*(fxCache[q]||1); }
      }
    } else {
      await ensureFX();
      if(b==='USD'){ price=fxCache[q]; }
      else if(q==='USD'){ price=fxCache[b]?1/fxCache[b]:null; }
      else if(fxCache[b]&&fxCache[q]){ price=fxCache[q]/fxCache[b]; }
    }
    if(price!=null){
      const sym = b==='IMOEX'?'':( ['USD','EUR','GBP','JPY','CHF'].includes(q)?
        ({USD:'$',EUR:'€',GBP:'£',JPY:'¥',CHF:'₣'}[q]):q+' ');
      const str=b==='IMOEX'
        ?price.toLocaleString('ru-RU',{maximumFractionDigits:2})+' пт'
        :sym+price.toLocaleString('ru-RU',{maximumFractionDigits:price>=100?2:price>=1?4:6});
      document.getElementById('price-main').textContent=str;
      if(change!=null){
        const el=document.getElementById('price-change');
        el.textContent=`${change>=0?'+':''}${change.toFixed(2)}% за 24ч`;
        el.className=change<0?'down':'up';
      }
      const now=new Date();
      document.getElementById('price-updated').textContent=
        `Обновлено ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){}
}
function startTicker(){ fetchAndShowPrice(); clearInterval(priceTimer);
  priceTimer=setInterval(fetchAndShowPrice,30000); }

    area.setData(kl.map(k=>({time:Math.floor(k[0]/1000),value:parseFloat(k[4])*rate})));

  }
  startTicker();
}

function fxDateRange(range){
  const dates=[], now=new Date();
  let numDays, step;
  switch(range){
    case '1D':  numDays=14;   step=1;  break;
    case '1M':  numDays=30;   step=1;  break;
    case '3M':  numDays=90;   step=3;  break;
    case '6M':  numDays=180;  step=6;  break;
    case '12M': numDays=365;  step=12; break;
    case 'ALL': numDays=1825; step=60; break;
    default:    numDays=14;   step=1;
  }
  for(let i=numDays;i>=0;i-=step){
    const d=new Date(now); d.setDate(d.getDate()-i);
    dates.push(d.toISOString().split('T')[0]);
  }
  return [...new Set(dates)];
}

async function createFiatChart(){
  const el=document.getElementById('tv-chart');
  if(lwRO){lwRO.disconnect();lwRO=null;}
  if(lwChart){try{lwChart.remove();}catch(e){} lwChart=null;}
  el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;'+
    'color:var(--ios-sec);flex-direction:column;gap:8px;font-size:14px">'+
    '<span style="font-size:36px">📊</span><span>Загрузка...</span></div>';
  try{
    const b=base.id.toLowerCase(), q=quote.id.toLowerCase();
    const dates=fxDateRange(curRange);
    const raw=await Promise.all(dates.map(date=>
      fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/${b}.json`)
        .then(r=>r.ok?r.json():null).catch(()=>null)
    ));
    const data=[];
    for(let i=0;i<dates.length;i++){
      const d=raw[i];
      const rate=d&&d[b]&&d[b][q]!=null?d[b][q]:null;
      if(rate!=null){
        const ts=new Date(dates[i]+'T12:00:00Z').getTime()/1000;
        if(!data.length||data[data.length-1].time!==ts) data.push({time:ts,value:rate});
      }
    }
    if(!data.length) throw new Error('no data');
    el.innerHTML='';
    const dk=theme==='dark';
    lwChart=LightweightCharts.createChart(el,{
      autoSize:true,
      layout:{background:{type:'solid',color:dk?'#000':'#fff'},textColor:dk?'#fff':'#000',fontSize:11},
      grid:{vertLines:{visible:false},horzLines:{color:dk?'#1e222d':'#f0f3fa'}},
      crosshair:{mode:1},
      rightPriceScale:{borderColor:dk?'#38383a':'#e5e5ea',scaleMargins:{top:0.08,bottom:0.08}},
      timeScale:{borderColor:dk?'#38383a':'#e5e5ea',timeVisible:false,fixLeftEdge:true,fixRightEdge:true},
      handleScroll:true,handleScale:true,
    });
    const area=lwChart.addAreaSeries({
      lineColor:'#34C759',topColor:'rgba(52,199,89,0.28)',bottomColor:'rgba(52,199,89,0)',
      lineWidth:2,crosshairMarkerRadius:4,lastValueVisible:true,
      priceLineVisible:true,priceLineColor:'#34C759',
    });
    area.setData(data);
    lwChart.timeScale().fitContent();
  }catch(e){
    if(lwChart){try{lwChart.remove();}catch(_){} lwChart=null;}
    el.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;'+
      'color:var(--ios-sec);flex-direction:column;gap:8px;font-size:14px">'+
      '<span style="font-size:36px">📊</span><span>Ошибка загрузки</span></div>';
  }
  startTicker();
}

function buildSymbol(){
  const b=base.id;
  if(b==='IMOEX') return 'MOEX:IMOEX';
  if(['XAU','XAG','XPT','XPD'].includes(b)) return `OANDA:${b}USD`;
  return null;
}
function createWidget(){
  if(CIDS[base.id]){ createCryptoChart(); return; }
  if(base.t!=='metal'&&base.id!=='IMOEX'){ createFiatChart(); return; }
  if(lwRO){lwRO.disconnect();lwRO=null;}
  if(lwChart){try{lwChart.remove();}catch(e){} lwChart=null;}
  const sym=buildSymbol(); if(!sym) return;
  document.getElementById('tv-chart').innerHTML='';
  if(typeof TradingView==='undefined'){
    document.getElementById('tv-chart').innerHTML=
      '<div style="display:flex;height:100%;align-items:center;justify-content:center;'+
      'color:var(--ios-sec);flex-direction:column;gap:8px;font-size:14px">'+
      '<span style="font-size:36px">📊</span><span>График загружается...</span></div>';
    startTicker(); return;
  }
  try{
    const cfg={
      autosize:true, symbol:sym, interval:curInterval,
      timezone:'Etc/UTC', theme:theme, style:'3', locale:'ru',
      container_id:'tv-chart', hide_top_toolbar:true, hide_legend:true,
      range:curRange, save_image:false, allow_symbol_change:false, show_popup_button:false,
      backgroundColor:theme==='light'?'#ffffff':'#000000',
      gridColor:theme==='light'?'#f0f3fa':'#1e222d'
    };
    if(base.t==='metal') cfg.currency_code=quote.id;
    new TradingView.widget(cfg);
    startTicker();
  }catch(e){ startTicker(); }
}
function setRange(r,i,btn){
  curRange=r; curInterval=i;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); createWidget();
}

// ─── MODAL ────────────────────────────────────────────────
function openModal(mode){
  selMode=mode;
  document.getElementById('sinput').value='';
  document.getElementById('mtitle').textContent='Выбор актива';
  document.getElementById('msearch').style.display='';
  document.getElementById('mtabs').style.display='';
  // Reset all tabs
  document.querySelectorAll('.mtab').forEach(t=>{ t.classList.remove('active'); t.style.display=''; });
  if(mode==='quote'){
    // Quote must always be fiat — crypto and metals never allowed as quote
    document.querySelector('.mtab[data-t="crypto"]').style.display='none';
    document.querySelector('.mtab[data-t="metal"]').style.display='none';
    activeTab='world';
    document.querySelector('.mtab[data-t="world"]')?.classList.add('active');
  } else {
    activeTab='crypto';
    document.querySelector('.mtab[data-t="crypto"]')?.classList.add('active');
  }
  renderList('');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
function setTab(t,el){
  activeTab=t;
  document.querySelectorAll('.mtab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  renderList(document.getElementById('sinput').value);
}
function renderList(search){
  const list=document.getElementById('alist'); list.innerHTML='';
  const q=search.toUpperCase();
  const items=ALL.filter(a=>
    (q?(a.id.includes(q)||a.n.toUpperCase().includes(q)):a.t===activeTab)
  );
  items.forEach(item=>{
    const div=document.createElement('div'); div.className='ai';
    if(selMode==='quote'&&item.id===base.id) div.classList.add('dis');
    div.innerHTML=`<span class="af">${item.f}</span>
      <div class="an"><span class="ab">${item.id}</span><span class="as">${item.n}</span></div>`;
    if(!div.classList.contains('dis')) div.onclick=()=>{
      if(selMode==='base'){
        base=item;
        document.getElementById('base-flag').textContent=item.f;
        document.getElementById('base-code').textContent=item.id;
        if(item.t==='crypto'&&!['USD','EUR'].includes(quote.id))
          { quote=find('USD'); updateQuoteUI(); }
        if(item.t==='metal'&&(quote.t==='crypto'||quote.t==='metal'))
          { quote=find('USD'); updateQuoteUI(); }
      } else {
        quote=item;
        updateQuoteUI();
      }
      document.getElementById('price-main').textContent='–';
      document.getElementById('price-change').textContent='–';
      createWidget(); closeModal();
    };
    list.appendChild(div);
  });
}
function updateQuoteUI(){
  document.getElementById('quote-flag').textContent=quote.f;
  document.getElementById('quote-code').textContent=quote.id;
}

  convModalTarget=target;

  const list=document.getElementById('alist'); list.innerHTML='';
  // render is handled by renderList with overridden click
  const q='';
  const items=ALL.filter(a=>a.t===activeTab);
  renderListConv(items);
  document.getElementById('modal-overlay').classList.add('open');

  // Override tab clicks for conv modal
  document.querySelectorAll('.mtab').forEach(el=>{

function renderListConv(items){
  const list=document.getElementById('alist'); list.innerHTML='';
  items.forEach(item=>{
    const div=document.createElement('div'); div.className='ai';
    div.innerHTML=`<span class="af">${item.f}</span>
      <div class="an"><span class="ab">${item.id}</span><span class="as">${item.n}</span></div>`;
    div.onclick=()=>{
      if(convModalTarget==='from'){
        convFrom=item;
        document.getElementById('cf-flag').textContent=item.f;
        document.getElementById('cf-code').textContent=item.id;
      } else {
        convTo=item;
        document.getElementById('ct-flag').textContent=item.f;
        document.getElementById('ct-code').textContent=item.id;
      }
      convCalc(); renderQuick();
      closeModal();

function restoreModalHandlers(){
  document.querySelectorAll('.mtab').forEach(el=>{
    el.style.display='';
    el.onclick=()=>setTab(el.dataset.t,el);
  });
  document.getElementById('sinput').oninput=function(){renderList(this.value);};
}

// ─── CALCULATOR ───────────────────────────────────────────
let cs={d:'0',prev:null,op:null,newN:true,hist:''};

function calcMode(){ return document.getElementById('csubtabs').querySelector('.active').dataset?.mode||'std'; }

function setCalcMode(m){
  document.querySelectorAll('.cst').forEach((el,i)=>el.classList.toggle('active',(i===0&&m==='std')||(i===1&&m==='pct')));
  document.getElementById('numpad').style.display=m==='std'?'grid':'none';
  document.getElementById('pctcalc').style.display=m==='pct'?'flex':'none';
}
// set data-mode on subtabs
document.querySelectorAll('.cst').forEach((el,i)=>el.dataset.mode=i===0?'std':'pct');

function dispCalc(){
  const el=document.getElementById('cdisp');
  const s=cs.d.replace('.',',');
  el.textContent=s;
  el.style.fontSize=s.length>12?'32px':s.length>9?'40px':'52px';
  document.getElementById('chist').textContent=cs.hist;
  // highlight active op
  ['÷','×','−','+'].forEach(op=>{
    const id={'÷':'btn-div','×':'btn-mul','−':'btn-sub','+':'btn-add'}[op];
    document.getElementById(id)?.classList.toggle('aop',cs.op===op&&cs.newN);
  });
}
function cleanNum(n){
  if(!isFinite(n)||isNaN(n)) return 'Ошибка';
  return parseFloat(n.toPrecision(10)).toString();
}
function compute(a,b,op){
  switch(op){case'+':return a+b;case'−':return a-b;case'×':return a*b;case'÷':return b?a/b:NaN;}
}
function ck(key){
  if('0123456789'.includes(key)){
    if(cs.newN){ cs.d=key==='0'?'0':key; cs.newN=false; }
    else if(cs.d.replace('-','').replace('.','').length<9)
      cs.d=cs.d==='0'?key:cs.d+key;
  } else if(key==='.'){
    if(cs.newN){ cs.d='0.'; cs.newN=false; }
    else if(!cs.d.includes('.')) cs.d+='.';
  } else if(key==='AC'){
    cs={d:'0',prev:null,op:null,newN:true,hist:''};
  } else if(key==='±'){
    if(cs.d!=='0') cs.d=cs.d.startsWith('-')?cs.d.slice(1):'-'+cs.d;
  } else if(key==='%'){
    const v=parseFloat(cs.d);
    cs.d=(cs.prev!=null?cs.prev*v/100:v/100).toString();
  } else if(['+','−','×','÷'].includes(key)){
    if(!cs.newN&&cs.op){
      const r=compute(cs.prev,parseFloat(cs.d),cs.op);
      cs.prev=r; cs.d=cleanNum(r);
    } else { cs.prev=parseFloat(cs.d); }
    cs.op=key; cs.hist=cs.d+' '+key; cs.newN=true;
  } else if(key==='='){
    if(cs.op&&cs.prev!=null){
      const b=parseFloat(cs.d), r=compute(cs.prev,b,cs.op);
      cs.hist=cs.prev+' '+cs.op+' '+b+' =';
      cs.d=cleanNum(r); cs.prev=null; cs.op=null; cs.newN=true;
    }
  }
  // Update AC label
  document.querySelector('#numpad .nf').textContent=
    (cs.d==='0'&&!cs.prev&&!cs.op)?'AC':'C';
  dispCalc();
}

// ─── PERCENT CALC ─────────────────────────────────────────
function fmt4(n){ return isNaN(n)?'–':n.toLocaleString('ru-RU',{maximumFractionDigits:4}); }
function doPct(){
  const a=parseFloat(document.getElementById('pa').value);
  const b=parseFloat(document.getElementById('pb').value);
  document.getElementById('pr1').textContent=(!isNaN(a)&&!isNaN(b))?fmt4(a*b/100):'–';
  document.getElementById('pr2').textContent=(!isNaN(a)&&!isNaN(b))?fmt4(a+a*b/100):'–';
  document.getElementById('pr3').textContent=(!isNaN(a)&&!isNaN(b))?fmt4(a-a*b/100):'–';
}
function doPctChg(){
  const c=parseFloat(document.getElementById('pc').value);
  const d=parseFloat(document.getElementById('pd').value);
  const el4=document.getElementById('pr4'), el5=document.getElementById('pr5');
  if(!isNaN(c)&&!isNaN(d)&&c!==0){
    const pct=((d-c)/Math.abs(c))*100;
    el4.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';
    el4.className='prv '+(pct>=0?'g':'r');
    el5.textContent=(d-c>=0?'+':'')+fmt4(d-c);
    el5.className='prv '+(d-c>=0?'g':'r');
  } else { el4.textContent='–'; el4.className='prv'; el5.textContent='–'; el5.className='prv'; }
}

// ─── INIT ─────────────────────────────────────────────────
restoreModalHandlers();
renderQuick();
applyTheme(theme);
applyViewport();
// viewportChanged fires after tg.expand() - that's when we know the real height.
// Fallback: if viewport was already full-size on load, create chart after short delay.
if(tg.viewportHeight > 100){
  setTimeout(createWidget, 150);
} else {
  setTimeout(()=>{ if(!lwChart){ applyViewport(); createWidget(); } }, 800);
}
